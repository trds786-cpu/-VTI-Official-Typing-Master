<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />

  <!-- VTI Ribbon / Shield Emblem -->
  <path d="M170 80 L342 80 L310 136 L202 136 Z" fill="url(#goldGrad)" opacity="0.9" />
  <text x="256" y="120" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="4">VTI OFFICIAL</text>

  <!-- Keyboard Base -->
  <rect x="76" y="160" width="360" height="236" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4" />
  
  <!-- Keys Grid Home Row & Details -->
  <!-- Row 1 -->
  <rect x="106" y="188" width="50" height="42" rx="8" fill="#334155" />
  <text x="131" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">Q</text>
  <rect x="168" y="188" width="50" height="42" rx="8" fill="#334155" />
  <text x="193" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">W</text>
  <rect x="231" y="188" width="50" height="42" rx="8" fill="#334155" />
  <text x="256" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">E</text>
  <rect x="294" y="188" width="50" height="42" rx="8" fill="#334155" />
  <text x="319" y="215" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">R</text>
  <rect x="356" y="188" width="50" height="42" rx="8" fill="url(#accentGrad)" />
  <text x="381" y="215" font-family="'Noto Nastaliq Urdu', 'Urdu Typesetting', Tahoma" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">ت</text>

  <!-- Row 2 (Home Row) -->
  <rect x="96" y="242" width="54" height="42" rx="8" fill="#334155" />
  <text x="123" y="269" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">A</text>
  <rect x="160" y="242" width="54" height="42" rx="8" fill="url(#accentGrad)" />
  <text x="187" y="269" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  <rect x="224" y="242" width="54" height="42" rx="8" fill="#334155" />
  <text x="251" y="269" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">D</text>
  <rect x="288" y="242" width="54" height="42" rx="8" fill="#334155" />
  <text x="315" y="269" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">F</text>
  <rect x="352" y="242" width="64" height="42" rx="8" fill="#334155" />
  <text x="384" y="270" font-family="'Noto Nastaliq Urdu', 'Urdu Typesetting', Tahoma" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">ک</text>

  <!-- Row 3 Spacebar -->
  <rect x="146" y="296" width="220" height="38" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <text x="256" y="321" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="2">SPACEBAR</text>

  <!-- Speed Needle / Speedometer Badge -->
  <circle cx="256" cy="396" r="38" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" />
  <path d="M256 396 L278 376" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="396" r="6" fill="#fbbf24" />

  <!-- Subtitle -->
  <text x="256" y="460" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">TYPING MASTER</text>
  <text x="256" y="484" font-family="'Noto Nastaliq Urdu', 'Urdu Typesetting', Tahoma" font-size="18" fill="#38bdf8" text-anchor="middle">انگلش اور اردو ٹائپنگ ماسٹر</text>
</svg>
